<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Quoin</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #11110f;
        color: #f4f4f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .badge {
        font-size: 0.8125rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(244, 244, 240, 0.5);
        margin-bottom: 1.25rem;
        font-weight: 500;
      }
      h1 {
        font-size: 2.75rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 1.25rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: rgba(244, 244, 240, 0.7);
        margin-bottom: 2.5rem;
        max-width: 440px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 2.25rem;
        border-radius: 9999px;
        background-color: #f4f4f0;
        color: #11110f;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      a.button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">404 Error</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
      <a href="https://quoin.online/" class="button">Return to Homepage</a>
    </main>
  </body>
</html>
