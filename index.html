<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11110f" />
    <title>Web Scraping, AI Assistants &amp; SEO for Businesses | Quoin</title>
    <meta
      name="description"
      content="Quoin builds custom web scraping, internal knowledge assistants and SEO reporting for businesses. Every project is scoped in writing before work starts."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://quoin.online/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quoin" />
    <meta property="og:url" content="https://quoin.online/" />
    <meta
      property="og:title"
      content="Web Scraping, AI Assistants &amp; SEO for Businesses | Quoin"
    />
    <meta
      property="og:description"
      content="Quoin builds custom web scraping, internal knowledge assistants and SEO reporting for businesses. Every project is scoped in writing before work starts."
    />
    <meta property="og:image" content="https://quoin.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quoin" />

    <!-- Organization Structured Data (Homepage) -->
    <script id="schema-org-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Quoin",
        "url": "https://quoin.online",
        "email": "contact@quoin.online",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Greater Noida",
          "addressRegion": "Uttar Pradesh",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;760&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
